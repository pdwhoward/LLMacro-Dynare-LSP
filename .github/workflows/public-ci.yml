name: Public LSP regression tests

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dynare-public-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  regression-tests:
    # Do not run untrusted forks on a self-hosted machine. The public repo needs
    # its OWN registered runner; no runner is shared from another repository.
    if: >-
      vars.DYNARE_PUBLIC_CI_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, llmacro-ci]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dependencies: [minimum, current]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out a clean disposable copy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false
      - name: Create isolated Python environment
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "dynare-public-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-${{ matrix.dependencies }}"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $venv "Scripts")
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Install minimum transport versions
        if: matrix.dependencies == 'minimum'
        run: python -m pip install "pygls==2.0.0" "lsprotocol==2025.0.0" "mcp==1.26.0"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run published regression suite
        run: python -B -m pytest dynare_lsp/tests -q -p no:cacheprovider
      - name: Check source remains unchanged
        run: git diff --exit-code
